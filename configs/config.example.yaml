server:
  http_addr: ":8080"
  grpc_addr: ":9090"
  shutdown_timeout: 10s
database:
  url: "postgres://infra:infra@localhost:55432/infra_controlplane?sslmode=disable"
  max_connections: 20
redis:
  addr: "localhost:56379"
  password: ""
  db: 0
executor:
  poll_interval: 2s
  task_timeout: 30s
  max_retries: 3
drift:
  interval: 60s
logging:
  level: "info"
