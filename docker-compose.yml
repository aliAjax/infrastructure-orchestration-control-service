services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: infra
      POSTGRES_DB: infra_controlplane
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra -d infra_controlplane"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - infra_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - infra_redis:/data

volumes:
  infra_postgres:
  infra_redis:
